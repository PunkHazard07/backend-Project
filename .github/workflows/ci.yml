name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Run Jest Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test -- --ci
  
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare .env.test
        run: |
          cp .env.ci .env.test
          echo "" >> .env.test
          echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_TEST_SECRET_KEY }}" >> .env.test
          echo "PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_TEST_PUBLIC_KEY }}" >> .env.test

      - name: Debug — inspect .env.test shape
        run: |
          echo "Total lines: $(wc -l < .env.test)"
          grep -n '^PAYSTACK_SECRET_KEY=' .env.test || echo "No PAYSTACK_SECRET_KEY line found"
          grep -n '^PAYSTACK_PUBLIC_KEY=' .env.test || echo "No PAYSTACK_PUBLIC_KEY line found"
          awk -F'=' '/^PAYSTACK_SECRET_KEY=/{print "PAYSTACK_SECRET_KEY value length:", length($2)}' .env.test
          awk -F'=' '/^PAYSTACK_PUBLIC_KEY=/{print "PAYSTACK_PUBLIC_KEY value length:", length($2)}' .env.test

      - name: Run integration tests
        run: npm run test:integration -- --ci